<style>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayNum = d => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => keyOf(new Date());
const today = () => dayNum(new Date());
const fmtDate = d => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };

// ---------- state ----------
const LS = "nihongo-path-v1";
function defaultState() {
  return { v: 1, start: todayKey(), move: "2028-04-01", newPerDay: 15, extraWords: 0, extraKanji: 0, phaseOverride: "",
    decks: { hi: true, ka: false, vo: false, kj: false }, srs: {}, days: {}, newCount: {}, grammar: {}, milestones: {}, kanaBest: 0, updatedAt: 0 };
}
let S = defaultState();
function merge(x) { const d = defaultState(); return Object.assign(d, x || {}, { decks: Object.assign(d.decks, (x || {}).decks || {}) }); }
try { const raw = localStorage.getItem(LS); if (raw) S = merge(JSON.parse(raw)); } catch (e) {}
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

let dbDoc = null, pushTimer = null, pushing = false, pushAgain = false;
function setSync(kind, text) { $("#syncDot").className = "dot " + (kind || ""); $("#syncText").textContent = text; }
function save() { S.updatedAt = Date.now(); saveLocal(); if (dbDoc) { clearTimeout(pushTimer); pushTimer = setTimeout(push, 1200); } }
async function push() {
  if (!dbDoc) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try { await dbDoc.set(JSON.parse(JSON.stringify(S))); setSync("ok", "Синхронизировано с аккаунтом"); }
  catch (e) { setSync("err", "Не удалось сохранить в аккаунт, данные есть в браузере"); }
  pushing = false;
  if (pushAgain) { pushAgain = false; push(); }
}
async function initCloud() {
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/app");
    const timer = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000));
    const snap = await Promise.race([ref.get(), timer]);
    dbDoc = ref;
    if (snap.exists) {
      const remote = snap.data() || {};
      if ((remote.updatedAt || 0) > (S.updatedAt || 0)) { S = merge(remote); saveLocal(); render(); }
      else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) push();
    } else if (S.updatedAt) push();
    setSync("ok", "Синхронизировано с аккаунтом");
  } catch (e) { setSync("err", "Аккаунт недоступен, прогресс хранится в браузере"); }
}

// ---------- speech ----------
let ttsP = null, ttsOff = false;
async function say(text) {
  if (!ttsOff && window.claude?.use) {
    try {
      const t = await (ttsP ||= claude.use("tts"));
      if (t) { await t.speak(text, { language: "ja" }); return; }
    } catch (e) { if (e && e.code === "not_granted") ttsOff = true; if (e && (e.code === "viewer_stopped" || e.code === "stopped")) return; }
  }
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("ja")); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { toast("Озвучка недоступна в этом браузере"); }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.preventDefault(); say(b.dataset.say); } });

function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2200); }

}

function dayMinutes(k) {
  const d = S.days[k]; if (!d) return 0;

  const m = (d.done || []).reduce((s, id) => { const t = all.find(x => x[0] === id); return s + (t ? t[2] : 0); }, 0);

}

  while (active(keyOf(d))) { n++; d.setDate(d.getDate() - 1); }

}
function phaseIndex() {
  if (S.phaseOverride) return PHASES.findIndex(p => p.id === S.phaseOverride);

  let acc = 0;
  for (let i = 0; i < PHASES.length; i++) { acc += PHASES[i].weeks; if (weeks < acc) return i; }
  return PHASES.length - 1;
}
function phaseStart(i) { const d = parseKey(S.start); let w = 0; for (let j = 0; j < i; j++) w += PHASES[j].weeks; d.setDate(d.getDate() + w * 7); return d; }
const dayRec = k => (S.days[k] ||= { done: [], extra: 0, rev: 0 });

function dueIds(decks) {
  const t = today(), due = [], fresh = [];
  decks.forEach(dk => DECKS[dk].ids.forEach(id => { const s = S.srs[id]; if (!s) fresh.push(id); else if (s[0] <= t) due.push(id); }));
  return { due, fresh };
}
function grade(id, g) {
  const t = today(); let [due, ivl, ease, reps, lapses] = S.srs[id] || [t, 0, 250, 0, 0];
  if (g === 0) { reps = 0; lapses++; ivl = 0; ease = Math.max(130, ease - 20); due = t; }
  else {
    if (g === 1) { ivl = reps === 0 ? 1 : Math.max(ivl + 1, Math.round(ivl * 1.2)); ease = Math.max(130, ease - 15); }
    if (g === 2) { ivl = reps === 0 ? 1 : reps === 1 ? 3 : Math.max(ivl + 1, Math.round(ivl * ease / 100)); }
    if (g === 3) { ivl = reps === 0 ? 4 : Math.max(ivl + 2, Math.round(ivl * ease / 100 * 1.3)); ease += 15; }
    reps++; due = t + ivl;
  }
  S.srs[id] = [due, ivl, ease, reps, lapses];
}
const nextIvlLabel = (id, g) => {
  const s = S.srs[id] || [0, 0, 250, 0, 0]; const [, ivl, ease, reps] = s;
  if (g === 0) return "сейчас";
  let n = g === 1 ? (reps === 0 ? 1 : Math.max(ivl + 1, Math.round(ivl * 1.2))) : g === 2 ? (reps === 0 ? 1 : reps === 1 ? 3 : Math.max(ivl + 1, Math.round(ivl * ease / 100))) : (reps === 0 ? 4 : Math.max(ivl + 2, Math.round(ivl * ease / 100 * 1.3)));
  return n + " " + plural(n, "день", "дня", "дней");
};

}

  $$("[data-mode]").forEach(b => b.onclick = () => { if (aiMode !== b.dataset.mode) { aiMode = b.dataset.mode; aiTurns = []; } aiDraft = $("#aiIn").value; render(); });
  const cl = $("#aiClear"); if (cl) cl.onclick = () => { aiTurns = []; render(); };
  $("#aiIn").oninput = e => aiDraft = e.target.value;
  $("#aiIn").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("#aiForm").requestSubmit(); } };
  $("#aiForm").onsubmit = e => { e.preventDefault(); if (STANDALONE) $("#aiCopy").click(); else sendAI(); };
  $("#aiStop").onclick = () => aiCtl?.abort();
  const ch = $("#chat"); ch.scrollTop = ch.scrollHeight;
};
function msgHTML(t) {
  if (t.role === "user") return `<div class="msg u jp">${esc(t.content)}</div>`;
  const jp = (t.content.match(/[぀-ヿ一-鿿][぀-ヿ一-鿿、。！？ー\s]*/g) || []).join(" ").trim();
  return `<div class="msg a"><span class="jpx">${esc(t.content)}</span>${jp && t.content ? `<div style="margin-top:6px">${sayBtn(jp.slice(0, 500), "Озвучить японский текст")}</div>` : ""}</div>`;
}
async function sendAI() {
  const text = $("#aiIn").value.trim(); if (!text || aiBusy) return;
  const sample = window.claude?.use ? await claude.use("sample") : null;
  if (!sample) { $("#aiStatus").textContent = "Встроенный сэнсэй сейчас недоступен. Нажмите «Скопировать для другого ИИ» и продолжите в любом бесплатном чате."; return; }
  aiTurns.push({ role: "user", content: text }); aiDraft = ""; aiBusy = true;
  const bot = { role: "assistant", content: "" }; aiTurns.push(bot); render();
  $("#aiStatus").textContent = "Сэнсэй думает…";
  aiCtl = new AbortController();
  const ch = $("#chat"), bubble = ch.lastElementChild;
  try {
    const turns = aiTurns.slice(0, -1).slice(-16);
    const { text: out } = await sample([{ role: "user", content: aiRules() }, { role: "assistant", content: "Понял. Жду сообщения ученика." }, ...turns], {
      cache: false, signal: aiCtl.signal, onText: ({ text }) => { bot.content = text; const sp = bubble.querySelector(".jpx"); if (sp) sp.textContent = text; ch.scrollTop = ch.scrollHeight; } });
    bot.content = out;
  } catch (e) {
    if (!bot.content) aiTurns.pop();
    const msg = e?.code === "not_granted" ? "Доступ к Claude не разрешён для этой страницы. Включите его в меню «Разрешения» или нажмите «Скопировать для другого ИИ»." : e?.code === "rate_limited" ? "Лимит запросов исчерпан. Подождите или нажмите «Скопировать для другого ИИ»." : e?.name === "AbortError" || e?.code === "aborted" ? "Остановлено." : "Не удалось получить ответ. Попробуйте ещё раз.";
    aiBusy = false; render(); $("#aiStatus").textContent = msg; return;
  }
  aiBusy = false; render();
}
