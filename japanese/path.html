const BYCHAR = {}; KANA.forEach(k => { BYCHAR[k.h] = k; BYCHAR[k.k] = k; });
const rowItems = (i, script) => { const [g, rs, hs, ks] = KANA_ROWS[i]; const r = rs.split(" "), c = [...(script === "k" ? ks : hs)]; return r.map((x, j) => x === "_" ? null : { c: c[j], r: x, script }).filter(Boolean); };
const yoonItems = script => YOON.map(([r, h, k]) => ({ c: script === "k" ? k : h, r, script }));
function toRomaji(s) {
  let out = "";
  for (let i = 0; i < s.length; i++) {
    const two = s.slice(i, i + 2), ch = s[i];
    if (BYCHAR[two] && two.length === 2) { out += BYCHAR[two].r; i++; continue; }
    if (ch === "っ" || ch === "ッ") { const nx = s.slice(i + 1, i + 3); const r = (BYCHAR[nx]?.r) || (BYCHAR[s[i + 1]]?.r) || ""; out += r[0] === "c" ? "t" : (r[0] || ""); continue; }
    if (ch === "ー") { out += out.slice(-1); continue; }
    out += BYCHAR[ch] ? BYCHAR[ch].r : ch === " " ? " " : ch;
  }
  return out;
}
const splitKana = s => { const t = []; for (let i = 0; i < s.length; i++) { const two = s.slice(i, i + 2); if (two.length === 2 && BYCHAR[two]) { t.push(two); i++; } else t.push(s[i]); } return t; };

function knownBefore(idx) {

function allowedChars(idx, includeSelf) {
  const s = new Set(); UNITS.slice(0, idx + (includeSelf ? 1 : 0)).forEach(u => unitItems(u).forEach(it => [...it.c].forEach(c => s.add(c))));
  if (UNITS.slice(0, idx + 1).some(u => u.yoon)) ["ゃ", "ゅ", "ょ", "っ"].forEach(c => s.add(c));
  if (UNITS.slice(0, idx + 1).some(u => u.id === "k6")) ["ー", "ッ", "ャ", "ュ", "ョ"].forEach(c => s.add(c));

}

function exPickSound(it, pool) { const opts = new Set([it.r]); for (const p of shuffle(pool)) { if (opts.size >= 4) break; opts.add(p.r); } return { type: "pick", q: "Как читается этот знак?", big: it.c, answer: it.r, options: shuffle([...opts]), say: it.c, info: MN[it.c] ? "" : "" }; }
function exPickKana(it, pool) { const opts = new Map([[it.c, 1]]); for (const p of shuffle(pool)) { if (opts.size >= 4) break; if (p.r !== it.r) opts.set(p.c, 1); } return { type: "pick", q: `Какой знак читается «${it.r}»?`, answer: it.c, options: shuffle([...opts.keys()]), jpOpts: true, say: it.c }; }

    const ok = map[selL.dataset.l] === selR.dataset.r;
    if (ok) { say(selL.dataset.l); [selL, selR].forEach(x => { x.classList.remove("sel"); x.classList.add("ok"); x.disabled = true; setTimeout(() => x.classList.add("gone"), 350); }); left--; }
    else { errs++; [selL, selR].forEach(x => { x.classList.add("bad"); setTimeout(() => x.classList.remove("bad", "sel"), 450); }); }
    selL = selR = null;
    if (!left) { if (errs) L.mistakes++; foot("ok", errs ? "Готово" : "Все пары верно!", "", "Дальше"); $("#cta").onclick = () => next(); }
  };
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { selL?.classList.remove("sel"); selL = b; b.classList.add("sel"); tryPair(); });
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { selR?.classList.remove("sel"); selR = b; b.classList.add("sel"); tryPair(); });
}
function bindBuild(e) {
  const chosen = [], slots = $("#slots"), sep = e.sep || "";
  const draw = () => {
    slots.innerHTML = chosen.map((ti, k) => `<button class="tile" data-k="${k}">${esc(e.tiles[ti])}</button>`).join("");
    document.querySelectorAll(".tiles .tile").forEach(b => b.classList.toggle("used", chosen.includes(+b.dataset.t)));
    slots.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { chosen.splice(+b.dataset.k, 1); draw(); });
    $("#cta").disabled = !chosen.length;
  };
  document.querySelectorAll(".tiles .tile").forEach(b => b.onclick = () => { if (!chosen.includes(+b.dataset.t)) { chosen.push(+b.dataset.t); say(e.tiles[+b.dataset.t]); draw(); } });
  $("#cta").onclick = () => {
    const got = chosen.map(i => e.tiles[i]).join(sep), ok = got === e.answer;
    document.querySelectorAll(".tile").forEach(b => b.disabled = true);
    say(e.say || e.answer);
    result(ok, e, ok ? esc(toRomaji(e.answer.replace(/ /g, " "))) : `Правильно: <span class="jp">${esc(e.answer)}</span> (${esc(toRomaji(e.answer))})`);
  };
}
function finish() {
  const u = UNITS[L.idx], acc = Math.max(0, 1 - L.mistakes / Math.max(1, L.total)), stars = acc >= .9 ? 3 : acc >= .7 ? 2 : 1;
  const xp = 10 + stars * 5;
  const t = keyOf(new Date()), y = new Date(); y.setDate(y.getDate() - 1);
  if (S.last !== t) { S.streak = S.last === keyOf(y) ? S.streak + 1 : 1; S.last = t; }
  S.xp += xp; S.done[u.id] = Math.max(S.done[u.id] || 0, stars); save();
  const nu = UNITS[L.idx + 1];
  $("#app").innerHTML = `<div class="ex done-card"><div class="big jp">${stars === 3 ? "完璧" : "よし"}</div><h2 style="margin:0">${stars === 3 ? "Идеально!" : "Урок пройден!"}</h2><p style="margin:0;color:var(--ink-2)">${esc(u.title)} · ${esc(u.sub)}</p>
   <div class="stats"><div><b style="color:var(--gold)">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</b><span>оценка</span></div><div><b>+${xp}</b><span>опыта</span></div><div><b>🔥 ${S.streak}</b><span>дней подряд</span></div></div>
   ${stars < 3 ? `<p style="margin:0;font-size:14px;color:var(--ink-3)">Чтобы получить три звезды, пройдите урок ещё раз почти без ошибок.</p>` : ""}</div>`;
  foot("ok", nu ? `Дальше: ${nu.title}` : "Курс пройден!", nu ? nu.sub : "Вы знаете обе азбуки. Пора за учебник!", "На карту");
  $("#cta").onclick = () => renderMap();
}

renderMap();
initCloud();
</script></body></html>
