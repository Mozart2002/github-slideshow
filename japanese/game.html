<style>

:root{

}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-ui);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-family:var(--f-jp);font-weight:900;font-size:26px;color:var(--glow)}
.logo span{font-weight:800;font-size:18px}
.hud{display:flex;gap:16px;font-variant-numeric:tabular-nums;font-weight:700;align-items:center;flex-wrap:wrap}
.hud small{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.lives{letter-spacing:2px;font-size:18px}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--night-2)}
canvas{display:block;width:100%;height:clamp(320px,58vh,560px);touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,14,32,.72)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.card h1{margin:0;font-size:1.5rem;font-weight:800;text-wrap:balance}
.card p{margin:0;color:var(--mute);line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 13px;font-weight:700;font-size:14px}
.seg button.on{background:var(--paper);color:var(--night);border-color:var(--paper)}
.lbl{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.go{background:var(--lantern);border:0;border-radius:10px;padding:13px;font-weight:800;font-size:17px;color:#fff;box-shadow:0 0 24px rgba(232,85,58,.45)}
.go:hover{filter:brightness(1.08)}
.ctrl{display:flex;flex-direction:column;gap:8px}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:700;text-align:center;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--paper)}
.type input.err{border-color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opts button{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:14px 6px;font-weight:800;font-size:18px;min-height:56px;word-break:break-word}
.opts button small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.opts.words button{font-size:14px}
.opts button:active{transform:translateY(1px)}
.opts button.ok{border-color:var(--ok)} .opts button.bad{border-color:var(--bad)}
.hint{font-size:12px;color:var(--mute);text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats div{background:var(--night-2);border-radius:10px;padding:10px}
.stats b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.miss{font-family:var(--f-jp);font-size:20px;display:flex;flex-wrap:wrap;gap:8px}
.miss span{background:var(--night-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.miss small{font-family:var(--f-ui);font-size:12px;color:var(--mute);margin-left:4px}
.icon{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.rank{display:flex;align-items:center;gap:10px;background:var(--night-2);border-radius:10px;padding:10px 12px}
.rank b{font-family:var(--f-jp);font-size:22px;color:var(--glow)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--glow)}
@media (max-width:560px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.hud{gap:12px}.logo span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

   <div><div class="lbl">Набор</div>${seg("pool", [["grow", "С нуля, по строкам"], ["all", "Всё сразу"]])}</div>
   <div class="seg" data-k="toggles"><button type="button" data-t="speech" class="${o.speech ? "on" : ""}">Озвучка</button><button type="button" data-t="sound" class="${o.sound ? "on" : ""}">Звуки</button></div>
   <button class="go" id="play">Играть</button>
   <p style="font-size:13px">Рекорд в этом режиме: <b style="color:var(--paper)">${P.best[modeKey()] || 0}</b></p></div>`;
  $("#menu").hidden = false;
  document.querySelectorAll("#menu .seg[data-k]").forEach(s => s.querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.t) P.opt[b.dataset.t] = !P.opt[b.dataset.t]; else P.opt[s.dataset.k] = b.dataset.v;
    saveP(); showMenu();
  }));
  $("#play").onclick = () => { beep(660, .05); start(); };
}
